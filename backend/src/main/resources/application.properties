spring.application.name=expensetracker.app
# Database Configuration (PostgreSQL 15 via Docker, H2 fallback for tests)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:expensedb}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.profiles.active=dev
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# H2 console (only effective when H2 is active)
spring.h2.console.enabled=true
# PostgreSQL RLS: set per-request via SET app.current_user_id (see TenantContext)
# Redis (overridden in docker-compose)
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.timeout=2000
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
ai.parser.url=${AI_PARSER_URL:http://localhost:8000}